name: Staging branch validation

on:
  push:
    branches:
      - hosting/vercel-free-staging
      - hosting/vercel-staging
      - feature/season-lifecycle-autonomy
      - feature/staging-safe-world-bootstrap
      - feature/beta-fresh-season-one
  pull_request:
    branches:
      - hosting/vercel-free-staging
      - hosting/vercel-staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_USE_FIREBASE_EMULATORS: 'true'
      GCLOUD_PROJECT: demo-forge-rivals
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Core regression tests
        run: npm run test:core

      - name: Test suite
        run: npm test

      - name: Firestore emulator registration transactions
        run: npm run test:registration:emulator

      - name: Pyramid Cup prepared-season emulator scenario
        run: npm run test:cup:emulator

      - name: Fresh Season 1 reset Firestore emulator scenario
        run: firebase emulators:exec --only auth,firestore --project demo-forge-rivals-reset-test "node --conditions=react-server --import tsx --test tests/fresh-season-one-reset-emulator.integration.test.mjs"

      - name: Production build
        run: npm run build
