name: Staging branch validation

on:
  push:
    branches:
      - hosting/vercel-free-staging
      - hosting/vercel-staging
      - feature/season-lifecycle-autonomy
      - feature/staging-safe-world-bootstrap
      - feature/beta-fresh-season-one
  pull_request:
    branches:
      - hosting/vercel-free-staging
      - hosting/vercel-staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_USE_FIREBASE_EMULATORS: 'true'
      GCLOUD_PROJECT: demo-forge-rivals
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Core regression tests
        run: npm run test:core

      - name: Test suite
        run: npm test

      - name: Firestore emulator registration transactions
        run: npm run test:registration:emulator

      - name: Pyramid Cup prepared-season emulator scenario
        run: npm run test:cup:emulator

      - name: Fresh Season 1 reset Firestore emulator scenario
        run: ./node_modules/.bin/firebase emulators:exec --only auth,firestore --project demo-forge-rivals-reset-test "node --conditions=react-server --import tsx --test tests/fresh-season-one-reset-emulator.integration.test.mjs"

      - name: Production build
        run: npm run build

  control-validation:
    name: Separate Control app validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/control
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: forge-rivals-beta.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: forge-rivals-beta
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:ci-placeholder
      GCLOUD_PROJECT: forge-rivals-beta
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Control dependencies
        run: npm install --no-audit --no-fund

      - name: Control security regression tests
        run: npm test

      - name: Control TypeScript check
        run: npm run typecheck

      - name: Control production build
        run: npm run build

  quality-gate-summary:
    name: Consolidated Beta quality gate
    runs-on: ubuntu-latest
    needs:
      - validate
      - control-validation
    if: always()
    steps:
      - name: Publish consolidated readiness verdict
        env:
          MAIN_RESULT: ${{ needs.validate.result }}
          CONTROL_RESULT: ${{ needs.control-validation.result }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          main="$MAIN_RESULT"
          control="$CONTROL_RESULT"
          verdict="PASS"
          if [ "$main" != "success" ] || [ "$control" != "success" ]; then
            verdict="FAIL"
          fi
          {
            echo "# Forge-Rivals Beta Quality Gate"
            echo
            echo "**Verdict: $verdict**"
            echo
            echo "| Gate | Status |"
            echo "|---|---|"
            echo "| Main application: typecheck, regression, full tests, Emulator scenarios and production build | $main |"
            echo "| Control application: security tests, typecheck and production build | $control |"
            echo "| Commit | $COMMIT_SHA |"
            echo "| Branch | $BRANCH_NAME |"
            echo "| Run | $RUN_URL |"
            echo
            echo "## Operational gates not executed by this CI workflow"
            echo
            echo "| Gate | Status | Reason |"
            echo "|---|---|---|"
            echo "| Exact-commit Vercel Preview readiness | NOT CHECKED | Deployment identity is verified separately |"
            echo "| Authenticated read-only live Beta preflight | NOT CHECKED | Run beta-season-one-preflight workflow separately |"
            echo "| Cloud Scheduler and Secret Manager inventory | NOT CHECKED | Requires separate read-only infrastructure review |"
            echo "| Browser registration and mobile user journeys | NOT CHECKED | Not covered by this workflow |"
            echo
            echo "A PASS here means source CI and isolated Emulator jobs passed. It is not authorization to reset, seed, restore, publish, or activate the live Beta world."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$verdict" != "PASS" ]; then
            echo "::error::Beta Quality Gate failed: main=$main control=$control"
            exit 1
          fi
