name: Beta Season 1 read-only preflight

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Beta Preview deployment URL (must be a forge-rivalss Vercel Preview)"
        required: true
        type: string
        default: "https://forge-rivalss-l76m2yamz-forge-rivals.vercel.app"
  deployment_status:

permissions:
  contents: read
  deployments: read

concurrency:
  group: beta-season-one-readonly-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'deployment_status' &&
           github.event.deployment_status.state == 'success' &&
           (github.event.deployment.ref == 'feature/beta-fresh-season-one' ||
            github.event.deployment.ref == 'refs/heads/feature/beta-fresh-season-one')) }}
    name: Authenticated read-only Beta preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Preview URL
        id: target
        env:
          DEPLOYMENT_URL: ${{ github.event_name == 'deployment_status' && github.event.deployment_status.target_url || inputs.deployment_url }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const url = new URL(process.env.DEPLOYMENT_URL);
          if (url.protocol !== 'https:' || url.username || url.password ||
              !/^forge-rivalss-[a-z0-9-]+-forge-rivals\.vercel\.app$/.test(url.hostname)) {
            throw new Error('Only the Forge-Rivals Vercel Preview host is allowed');
          }
          url.pathname = '';
          url.search = '';
          url.hash = '';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `BASE_URL=${url.origin}\n`);
          NODE
      - name: Call read-only preflight (GET only)
        env:
          BASE_URL: ${{ steps.target.outputs.BASE_URL }}
          CRON_SECRET: ${{ secrets.BETA_RESET_CRON_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Repository secret BETA_RESET_CRON_SECRET is not configured."
            exit 1
          fi
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::Repository secret VERCEL_TOKEN is not configured. Use Vercel CLI authenticated access; do not create a protection bypass."
            exit 1
          fi
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          npx --yes vercel@latest curl "${BASE_URL}/api/admin/staging-season-one-reset" -- \
            --silent --show-error --max-time 120 --request GET \
            --output "$response_file" \
            --write-out '\n__HTTP_STATUS__:%{http_code}' >> "$response_file" \
            --header "Authorization: Bearer ${CRON_SECRET}"
          unset CRON_SECRET VERCEL_TOKEN
          node - "$response_file" <<'NODE'
          const fs = require('node:fs');
          const file = process.argv[2];
          const raw = fs.readFileSync(file, 'utf8');
          const marker = raw.lastIndexOf('\n__HTTP_STATUS__:');
          if (marker < 0) throw new Error('Vercel CLI did not return an HTTP status; preflight result is unknown.');
          const status = Number(raw.slice(marker + '\n__HTTP_STATUS__:'.length).trim());
          let result;
          try { result = JSON.parse(raw.slice(0, marker)); }
          catch { throw new Error(`Preflight returned non-JSON response (HTTP ${status}).`); }
          if (![200, 409].includes(status) ||
              result.readOnly !== true ||
              result.project !== 'forge-rivalstest' ||
              !result.plan || typeof result.plan.ready !== 'boolean') {
            console.error(JSON.stringify(result, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({
            httpStatus: Number(status),
            success: result.success,
            readOnly: result.readOnly,
            project: result.project,
            ready: result.plan.ready,
            reasons: result.plan.reasons,
            target: result.plan.target,
            preserve: result.plan.preserve,
            replace: result.plan.replace,
            expected: result.plan.expected
          }, null, 2));
          if (!result.plan.ready) {
            console.log('Preflight completed safely, but Beta reset remains BLOCKED.');
          } else {
            console.log('Read-only preflight is READY. No reset was executed.');
          }
          NODE
